<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local AI Chat</title>
  <style>
    :root {
      --bg: #f7f7f7;
      --panel: #ffffff;
      --border: #e0e0e0;
      --text: #1f1f1f;
      --muted: #6b7280;
      --accent: #4f46e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app-shell {
      width: 100%;
      height: 100vh;
      display: none;
      background: var(--bg);
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100%;
      overflow: hidden;
    }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .new-chat {
      padding: 10px 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
    }
    .history {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 16px;
      background: linear-gradient(180deg, #fafafa 0%, #f5f5f5 100%);
    }
    .history-item {
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: white;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border 0.15s, box-shadow 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item.active {
      border-color: var(--accent);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.08);
    }
    .history-title {
      font-weight: 600;
      font-size: 14px;
    }
    .history-meta {
      font-size: 12px;
      color: var(--muted);
    }
    .main {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--panel);
      position: relative;
    }
    .topbar {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 3;
      background: rgba(255,255,255,0.9);
    }
    .topbar .right-actions { display: flex; gap: 8px; align-items: center; }
    .mobile-toggle {
      display: none;
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }
    .status {
      font-size: 14px;
      color: var(--muted);
    }
    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, #f9fafb 0%, #ffffff 18%);
    }
    .message {
      max-width: 72%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.5;
      box-shadow: 0 6px 14px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
    }
    .message.user { margin-left: auto; background: #eef2ff; border-color: #dfe4ff; }
    .message.ai { margin-right: auto; background: #ffffff; }
    .bubble-header { font-weight: 700; margin-bottom: 6px; font-size: 13px; color: #111827; }
    .typing { display: inline-block; position: relative; padding-left: 18px; color: var(--muted); }
    .typing::before, .typing::after { content: ''; position: absolute; top: 50%; width: 6px; height: 6px; background: var(--muted); border-radius: 50%; transform: translateY(-50%); animation: blink 1.2s infinite ease-in-out; }
    .typing::before { left: 0; animation-delay: 0s; }
    .typing::after { left: 10px; animation-delay: 0.3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
    .input-bar {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      position: sticky;
      bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      z-index: 2;
    }
    .input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      transition: border 0.15s, box-shadow 0.15s;
      background: #fff;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.12); }
    .send-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(79, 70, 229, 0.2);
    }
    .clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--muted);
    }
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      z-index: 19;
    }
    .quick-actions { display: flex; gap: 8px; padding: 10px 16px 0; flex-wrap: wrap; }
    .chip {
      padding: 8px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #f4f4f5;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .login-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg, #eef2ff 0%, #e5e7eb 100%);
      z-index: 999;
    }
    .login-box {
      background: #fff;
      padding: 28px;
      border-radius: 18px;
      width: min(420px, 90vw);
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }
    .login-box h2 { margin: 0 0 12px; }
    .login-box p { margin: 0 0 18px; color: var(--muted); }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field input {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 15px;
      outline: none;
    }
    .login-btn {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(79, 70, 229, 0.22);
    }
    .error { color: #b91c1c; font-size: 14px; min-height: 18px; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .sidebar.drawer {
        display: flex;
        position: fixed;
        inset: 0 auto 0 0;
        width: min(86vw, 360px);
        z-index: 20;
        box-shadow: 0 18px 48px rgba(0,0,0,0.2);
        transform: translateX(-105%);
        transition: transform 0.25s ease;
      }
      .sidebar.drawer.open { transform: translateX(0); }
      .mobile-toggle { display: inline-flex; align-items: center; gap: 6px; }
      .message { max-width: 90%; }
      .app-shell { height: 100vh; }
      .input-bar { padding-bottom: 16px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.74/dist/index.min.js"></script>
</head>
<body>
  <div class="login-overlay" id="login">
    <div class="login-box">
      <h2>Welcome back</h2>
      <p>Sign in to unlock the local AI chat experience.</p>
      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" required autocomplete="username" placeholder="ripo" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password" placeholder="6000" />
        </div>
        <div class="error" id="loginError"></div>
        <button class="login-btn" type="submit">Enter</button>
      </form>
    </div>
  </div>

  <div class="app-shell" id="app">
    <div class="backdrop" id="backdrop"></div>
    <div class="layout">
      <aside class="sidebar drawer" id="drawer">
        <div class="sidebar-header">
          <span>Chats</span>
          <button class="new-chat" id="newChat">+ New</button>
        </div>
        <div class="history" id="history"></div>
      </aside>
      <main class="main">
        <div class="topbar">
          <div>
            <strong>Local Assistant</strong>
            <div class="status" id="modelStatus">Loading engine...</div>
          </div>
          <div class="right-actions">
            <button class="mobile-toggle" id="openDrawer">☰ History</button>
            <button class="clear-btn" id="clearChat">Clear chat</button>
          </div>
        </div>
        <div class="chat-window" id="chatWindow"></div>
        <div class="quick-actions" id="quickActions">
          <div class="chip" data-text="Give me a concise summary of the key features.">Summary</div>
          <div class="chip" data-text="List three creative ideas to try.">Ideas</div>
          <div class="chip" data-text="Explain this like I'm new to the topic.">Explain simply</div>
          <div class="chip" data-text="Can you draft a short email template for me?">Email template</div>
        </div>
        <div class="input-bar">
          <input class="input" id="userInput" placeholder="Ask anything..." />
          <button class="send-btn" id="sendBtn">Send</button>
        </div>
      </main>
    </div>
  </div>

  <script>
    const AUTH_USER = "ripo";
    const AUTH_PASS = "6000";
    const MODEL_ID = "Phi-3-mini-4k-instruct-q4f16_1-MLC"; // fast, browser-friendly preset
    const STORAGE_KEY = 'local-chat-conversations-v1';

    const state = {
      conversations: [],
      activeId: null,
      enginePromise: null,
      modelReady: false,
      drawerOpen: false,
    };

    const loginOverlay = document.getElementById('login');
    const appShell = document.getElementById('app');
    const historyEl = document.getElementById('history');
    const chatWindow = document.getElementById('chatWindow');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const modelStatus = document.getElementById('modelStatus');
    const clearBtn = document.getElementById('clearChat');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const newChatBtn = document.getElementById('newChat');
    const drawer = document.getElementById('drawer');
    const openDrawerBtn = document.getElementById('openDrawer');
    const backdrop = document.getElementById('backdrop');
    const quickActions = document.getElementById('quickActions');

    const formatTime = (date = new Date()) => {
      return new Intl.DateTimeFormat('en', { hour: 'numeric', minute: '2-digit' }).format(date);
    };

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        conversations: state.conversations,
        activeId: state.activeId,
      }));
    }

    function hydrate() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.conversations = (parsed.conversations || []).map(c => ({
            ...c,
            createdAt: c.createdAt ? new Date(c.createdAt) : new Date(),
          }));
          state.activeId = parsed.activeId || state.conversations[0]?.id || null;
        }
      } catch (err) {
        console.warn('Failed to restore history', err);
      }
    }

    function ensureConversation() {
      if (!state.conversations.length) {
        const first = { id: crypto.randomUUID(), title: 'New Chat', createdAt: new Date(), messages: [] };
        state.conversations.push(first);
        state.activeId = first.id;
      }
      persist();
    }

    function renderHistory() {
      historyEl.innerHTML = '';
      state.conversations.forEach(conv => {
        const item = document.createElement('div');
        item.className = 'history-item' + (conv.id === state.activeId ? ' active' : '');
        item.innerHTML = `<div><div class="history-title">${conv.title}</div><div class="history-meta">${formatTime(conv.createdAt)}</div></div>`;
        item.onclick = () => { state.activeId = conv.id; renderHistory(); renderChat(); closeDrawer(); persist(); };
        historyEl.appendChild(item);
      });
    }

    function openDrawer() {
      state.drawerOpen = true;
      drawer.classList.add('open');
      backdrop.style.display = 'block';
    }

    function closeDrawer() {
      state.drawerOpen = false;
      drawer.classList.remove('open');
      backdrop.style.display = 'none';
    }

    function renderChat() {
      chatWindow.innerHTML = '';
      const conv = state.conversations.find(c => c.id === state.activeId);
      if (!conv) return;
      conv.messages.forEach(msg => {
        const bubble = document.createElement('div');
        bubble.className = `message ${msg.role === 'user' ? 'user' : 'ai'}`;
        bubble.innerHTML = `<div class="bubble-header">${msg.role === 'user' ? 'You' : 'AI'}</div><div>${msg.content}</div>`;
        chatWindow.appendChild(bubble);
      });
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function initEngine() {
      if (state.enginePromise) return state.enginePromise;
      try {
        if (!window.webllm?.CreateMLCEngine) {
          modelStatus.textContent = 'WebLLM script not ready. Please refresh.';
          return;
        }
        modelStatus.textContent = 'Initializing model...';
        const callbacks = {
          onLoadingProgress: (report) => {
            const pct = (report.progress || 0) * 100;
            modelStatus.textContent = `Downloading model (${pct.toFixed(0)}%)...`;
          }
        };
        state.enginePromise = window.webllm.CreateMLCEngine(MODEL_ID, { logLevel: 'error' }, callbacks);
        const engine = await state.enginePromise;
        state.modelReady = true;
        modelStatus.textContent = `Ready • ${MODEL_ID}`;
        return engine;
      } catch (err) {
        state.modelReady = false;
        modelStatus.textContent = 'Failed to load model. Check WebGPU support.';
        console.error(err);
      }
    }

    function addMessage(role, content) {
      const conv = state.conversations.find(c => c.id === state.activeId);
      if (!conv) return;
      conv.messages.push({ role, content });
      if (conv.title === 'New Chat' && role === 'user') {
        conv.title = content.slice(0, 30) || 'Conversation';
        renderHistory();
      }
      persist();
      renderChat();
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      if (!state.modelReady) {
        modelStatus.textContent = 'Model still loading. Please wait...';
        return;
      }
      userInput.value = '';
      addMessage('user', text);

      const typingBubble = document.createElement('div');
      typingBubble.className = 'message ai';
      typingBubble.innerHTML = '<div class="bubble-header">AI</div><div class="typing">Thinking</div>';
      chatWindow.appendChild(typingBubble);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      try {
        const engine = await state.enginePromise;
        const conv = state.conversations.find(c => c.id === state.activeId);
        let reply = '';
        const response = await engine.chat.completions.create({
          messages: conv.messages.map(m => ({ role: m.role, content: m.content })),
          stream: true,
          temperature: 0.7,
        }, {
          onToken: (token) => {
            reply += token;
            typingBubble.innerHTML = `<div class="bubble-header">AI</div><div>${reply}</div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;
          },
          onFinish: () => {
            typingBubble.remove();
            addMessage('assistant', reply.trim());
          },
        });
        await response;
      } catch (err) {
        typingBubble.remove();
        addMessage('assistant', 'Sorry, I ran into an error while generating that response.');
        console.error(err);
      }
    }

    function clearChat() {
      const conv = state.conversations.find(c => c.id === state.activeId);
      if (conv) {
        conv.messages = [];
        persist();
        renderChat();
      }
    }

    function createConversation() {
      const conv = { id: crypto.randomUUID(), title: 'New Chat', createdAt: new Date(), messages: [] };
      state.conversations.unshift(conv);
      state.activeId = conv.id;
      renderHistory();
      renderChat();
      persist();
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      if (user === AUTH_USER && pass === AUTH_PASS) {
        loginError.textContent = '';
        loginOverlay.style.display = 'none';
        appShell.style.display = 'block';
        ensureConversation();
        renderHistory();
        renderChat();
        initEngine();
        userInput.focus();
      } else {
        loginError.textContent = 'Invalid credentials. Try ripo / 6000.';
      }
    });

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    clearBtn.addEventListener('click', clearChat);
    newChatBtn.addEventListener('click', () => { createConversation(); userInput.focus(); });
    openDrawerBtn.addEventListener('click', openDrawer);
    backdrop.addEventListener('click', closeDrawer);
    quickActions.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      userInput.value = chip.dataset.text;
      sendMessage();
    });

    // Initialize default conversation for instant rendering
    hydrate();
    ensureConversation();
    renderHistory();
    renderChat();
    modelStatus.textContent = 'Preloading model in background...';
    initEngine();
  </script>
</body>
</html>
